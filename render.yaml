services:
  - type: web
    name: mp4-to-mp3-backend
    env: node
    plan: free
    buildCommand: npm install && mkdir -p bin && curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o ./bin/yt-dlp && chmod +x ./bin/yt-dlp
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ENABLE_YTDLP_FALLBACK
        value: "true"
      - key: YTDLP_PATH
        value: ./bin/yt-dlp
      - key: FRONTEND_URL
        fromContext: frontend_url
      - key: SUPABASE_URL
        fromContext: supabase_url
      - key: SUPABASE_ANON_KEY
        fromContext: supabase_anon_key
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromContext: supabase_service_role_key
